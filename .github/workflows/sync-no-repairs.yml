name: Sync no-repairs with upstream

# Keeps this fork's `no-repairs` branch current with hacs/integration's latest
# RELEASE (never unreleased main), carrying the auto-update patch forward, and
# publishes a release (hacs.zip)
# whenever the component changed since the last tag. HACS installs from these
# releases: the fork points its own-repository constant at this repo. On a
# merge conflict it stops and opens an issue rather than pushing something broken.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-no-repairs
  cancel-in-progress: false

env:
  # gh would otherwise pick the `upstream` remote as the target repository
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout no-repairs
        uses: actions/checkout@v4
        with:
          ref: no-repairs
          fetch-depth: 0

      - name: Merge the latest upstream release
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hacs/integration.git
          tag="$(gh api repos/hacs/integration/releases/latest --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --no-tags upstream "refs/tags/$tag"
          before="$(git rev-parse HEAD)"
          if ! git merge --no-edit -m "Merge hacs/integration $tag" FETCH_HEAD; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already contains hacs/integration $tag."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the patch survived
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          test -f custom_components/hacs/no_repairs.py
          test -f custom_components/hacs/binary_sensor.py
          grep -q 'Platform.BINARY_SENSOR' custom_components/hacs/__init__.py
          grep -q 'HacsAutoUpdateSwitchEntity' custom_components/hacs/switch.py
          test -f custom_components/hacs/auto_update.py
          grep -q 'auto_update: bool' custom_components/hacs/base.py
          grep -q 'AUTO_UPDATE' custom_components/hacs/config_flow.py
          grep -q 'from .no_repairs import' custom_components/hacs/base.py
          grep -q 'from ..no_repairs import' custom_components/hacs/repositories/integration.py
          grep -q 'INTEGRATION = "markfrancisonly/hacs-integration"' custom_components/hacs/enums.py
          grep -q 'UPSTREAM_INTEGRATION' custom_components/hacs/base.py
          grep -q 'async_refresh_self' custom_components/hacs/base.py
          # No call site may reach the real helpers again.
          ! grep -rn 'from homeassistant.helpers.issue_registry import .*async_create_issue' \
              custom_components/hacs/base.py custom_components/hacs/repositories/integration.py
          ! grep -rn 'from homeassistant.components.persistent_notification import' \
              custom_components/hacs/base.py
          python -m compileall -q custom_components/hacs

      - name: Set up minimum supported Python
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test automatic updates with minimum supported Home Assistant
        if: steps.merge.outputs.conflict == 'false'
        run: |
          scripts/install/pip_packages --requirement requirements_core_min.txt --requirement requirements_base.txt
          scripts/install/frontend
          python -m unittest discover -s tests_fork -v

      - name: Set up current Python
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Test automatic updates with current Home Assistant
        if: steps.merge.outputs.conflict == 'false'
        run: |
          scripts/install/pip_packages homeassistant --requirement requirements_base.txt
          python -m unittest discover -s tests_fork -v

      - name: Push the merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin no-repairs

      - name: Decide whether to release
        id: decide
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          # Only this fork's date tags; upstream's own tags are in the repository too.
          last="$(git tag -l '20[0-9][0-9].*' --sort=-v:refname | head -1)"
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- custom_components hacs.json; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No component change since $last."
            exit 0
          fi
          # Date versions sort above every upstream release; a second release
          # on the same day gets a numeric suffix.
          version="$(date -u +%Y.%-m.%-d)"; n=0
          while git rev-parse -q --verify "refs/tags/$version" >/dev/null; do
            n=$((n + 1)); version="$(date -u +%Y.%-m.%-d).$n"
          done
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # As upstream's publish job: the version is stamped into the zip only.
      - name: Build hacs.zip
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "/MINIMUM_HA_VERSION = /c\MINIMUM_HA_VERSION = \"$(jq .homeassistant -r hacs.json)\"" custom_components/hacs/const.py
          python3 scripts/update/manifest.py --version "$VERSION"
          scripts/install/frontend
          test -f custom_components/hacs/hacs_frontend/version.py
          cd custom_components/hacs && zip -q -r ../../hacs.zip ./

      - name: Publish the release
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          gh release create "$VERSION" hacs.zip --target "$(git rev-parse HEAD)" --title "$VERSION" \
            --notes "hacs/integration ${{ steps.merge.outputs.tag }} with the auto-update patch."

      - name: Open an issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream release merge conflict on no-repairs';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-conflict',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['sync-conflict'],
              body: [
                'Merging the latest hacs/integration release into `no-repairs` hit a conflict, so the branch was left unchanged.',
                '',
                'Resolve locally:',
                '```',
                'git fetch upstream --tags && git checkout no-repairs && git merge <latest release tag>',
                '```',
                'Run the fork regression tests before publishing:',
                '`python -m unittest discover -s tests_fork -v`.',
              ].join('\n'),
            });
